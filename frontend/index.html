<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Multi-Agent Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>Nexus AI</h2>
                <span>Enterprise Agent</span>
            </div>
            <div id="thread-list"></div>
            <button id="new-chat-btn">+ New Conversation</button>
        </aside>
        <main id="chat-area">
            <div class="top-nav">
                <h3>Current Thread</h3>
            </div>
            <div id="messages"></div>
            
            <div id="hitl-overlay" class="hidden">
                <div class="hitl-card">
                    <div class="hitl-icon">⚠</div>
                    <div class="hitl-content">
                        <h3>Human-in-the-Loop Required</h3>
                        <p id="hitl-question"></p>
                        <input type="text" id="hitl-input" placeholder="Provide clarification here...">
                        <button id="hitl-submit">Resolve</button>
                    </div>
                </div>
            </div>
            
            <div id="input-area">
                <div class="input-glass">
                    <input type="text" id="user-input" placeholder="Ask your agent anything...">
                    <button id="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
